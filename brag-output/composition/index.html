<!doctype html>
<html><head><meta charset="utf-8"><title>GrandPA2-Buddy brag</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:#1a1a2e;overflow:hidden}
#root{position:relative;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 40%,#25254a 0%,#1a1a2e 60%,#0d0d1a 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.hook{font-size:84px;font-weight:800;letter-spacing:-1px;text-align:center;max-width:1500px;line-height:1.15}
.cursor{display:inline-block;width:8px;height:80px;background:#e94560;vertical-align:-10px;margin-left:6px}
.title{font-size:150px;font-weight:900;letter-spacing:-3px}
.title span{color:#e94560}
.count{font-size:260px;font-weight:900;color:#e94560;line-height:1}
.sub{font-size:44px;color:#c9cbe0;margin-top:18px}
.term{width:1300px;background:#10101f;border:2px solid #0f3460;border-radius:20px;padding:44px 56px;box-shadow:0 0 90px rgba(233,69,96,.25)}
.cmd{font-size:40px;color:#fff;margin-bottom:34px}
.cmd b{color:#e94560}
.step{font-size:46px;color:#fff;margin:14px 0;opacity:0;display:flex;gap:26px}
.step i{font-style:normal;color:#e94560;width:50px}
.rings{position:relative;width:1200px;height:560px}
.ring{position:absolute;top:0;width:440px;height:440px;border-radius:50%;border:6px solid;display:flex;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:700;padding:90px;opacity:0}
.r1{left:20px;border-color:#e94560;background:rgba(233,69,96,.12)}
.r2{left:380px;border-color:#533483;background:rgba(83,52,131,.25)}
.r3{left:740px;border-color:#0f3460;background:rgba(15,52,96,.5)}
.cap{position:absolute;top:470px;width:100%;text-align:center;font-size:54px;font-weight:800;opacity:0}
.big{font-size:100px;font-weight:900;text-align:center;line-height:1.1;max-width:1500px}
</style></head><body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="20">

<div id="s1" class="scene clip" data-start="0" data-duration="3.2">
  <div class="hook"><span id="hooktxt"></span><span class="cursor"></span></div>
</div>

<div id="s2" class="scene clip" data-start="3" data-duration="4.2">
  <div class="title">GrandPA2-<span>Buddy</span></div>
  <div class="count mono" id="cnt">0</div>
  <div class="sub">MCP tools · grandMA2 · Telnet</div>
</div>

<div id="s3" class="scene clip" data-start="7" data-duration="6.2">
  <div class="term mono">
    <div class="cmd"><b>&gt;</b> run_agent_goal("warm wash on the front truss")</div>
    <div class="step"><i>✓</i>classify</div>
    <div class="step"><i>✓</i>plan</div>
    <div class="step"><i>✓</i>validate</div>
    <div class="step"><i>✓</i>execute</div>
    <div class="step"><i>✓</i>verify</div>
    <div class="step"><i>✓</i>trace</div>
  </div>
</div>

<div id="s4" class="scene clip" data-start="13" data-duration="4.2">
  <div class="rings">
    <div class="ring r1">OAuth scope</div>
    <div class="ring r2">MA2 native rights</div>
    <div class="ring r3">console floor</div>
    <div class="cap">All three must agree.</div>
  </div>
</div>

<div id="s5" class="scene clip" data-start="17" data-duration="3">
  <div class="big" id="o1">3,705 tests before it touches your rig.</div>
  <div class="title" id="o2" style="font-size:90px;margin-top:40px;opacity:0">GrandPA2-<span>Buddy</span></div>
  <div class="sub" id="o3" style="opacity:0">Let the lights listen.</div>
</div>

<audio id="bed" data-start="0" data-duration="20" data-volume="0.35" data-fade-in="1" data-fade-out="2" src="assets/music/bed.mp3"></audio>
<audio id="sfx1" data-start="0.3" data-duration="0.5" data-volume="0.4" src="assets/sfx/keypress-001.wav"></audio>
<audio id="sfx2" data-start="0.8" data-duration="0.5" data-volume="0.4" src="assets/sfx/keypress-003.wav"></audio>
<audio id="sfx3" data-start="1.3" data-duration="0.5" data-volume="0.4" src="assets/sfx/keypress-005.wav"></audio>
<audio id="sfx4" data-start="1.8" data-duration="0.5" data-volume="0.4" src="assets/sfx/keypress-007.wav"></audio>
<audio id="sfx5" data-start="3.3" data-duration="1" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
<audio id="sfx6" data-start="8.4" data-duration="0.5" data-volume="0.5" src="assets/sfx/click_001.ogg"></audio>
<audio id="sfx7" data-start="9.0" data-duration="0.5" data-volume="0.5" src="assets/sfx/click_001.ogg"></audio>
<audio id="sfx8" data-start="9.6" data-duration="0.5" data-volume="0.5" src="assets/sfx/click_001.ogg"></audio>
<audio id="sfx9" data-start="10.2" data-duration="0.5" data-volume="0.5" src="assets/sfx/click_001.ogg"></audio>
<audio id="sfx10" data-start="10.8" data-duration="0.5" data-volume="0.5" src="assets/sfx/click_001.ogg"></audio>
<audio id="sfx11" data-start="11.4" data-duration="0.5" data-volume="0.5" src="assets/sfx/click_001.ogg"></audio>
<audio id="sfx12" data-start="13.5" data-duration="0.5" data-volume="0.4" src="assets/sfx/switch_002.ogg"></audio>
<audio id="sfx13" data-start="14.2" data-duration="0.5" data-volume="0.4" src="assets/sfx/switch_002.ogg"></audio>
<audio id="sfx14" data-start="14.9" data-duration="0.5" data-volume="0.4" src="assets/sfx/switch_002.ogg"></audio>
<audio id="sfx15" data-start="18.6" data-duration="1.4" data-volume="0.5" src="assets/sfx/bong_001.ogg"></audio>

<script src="assets/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
const show = (id, s, d) => { tl.set(id, {opacity:1}, s); tl.set(id, {opacity:0}, s+d); };
show("#s1",0,3.0); show("#s2",3.0,4.0); show("#s3",7.0,6.0); show("#s4",13.0,4.0); show("#s5",17.0,3.0);

// Scene 1: typed hook (typing 0.3 -> 2.1s), hold to 3.0
const text = "What if your lighting console could listen?";
const o = {n:0};
tl.to(o, {n:text.length, duration:1.8, ease:"none", onUpdate(){document.getElementById("hooktxt").textContent=text.slice(0,Math.round(o.n));}}, 0.3);

// Scene 2: title + counter 0 -> 210
tl.from("#s2 .title", {y:40, opacity:0, duration:.5}, 3.1);
const c = {v:0};
tl.to(c, {v:210, duration:1.4, ease:"power2.out", onUpdate(){document.getElementById("cnt").textContent=Math.round(c.v);}}, 3.4);
tl.from("#s2 .sub", {opacity:0, y:20, duration:.5}, 4.6);

// Scene 3: terminal, six steps ~0.6s apart
tl.from("#s3 .term", {y:50, opacity:0, duration:.5}, 7.0);
document.querySelectorAll("#s3 .step").forEach((el,i)=>{ tl.fromTo(el,{opacity:0,x:-40},{opacity:1,x:0,duration:.35}, 8.4+i*0.6); });

// Scene 4: rings arrive one by one, then caption (held ~1.5s)
["#s4 .r1","#s4 .r2","#s4 .r3"].forEach((r,i)=>{ tl.fromTo(r,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.5,ease:"back.out(1.6)"}, 13.4+i*0.7); });
tl.to("#s4 .cap",{opacity:1,duration:.4}, 15.4);

// Scene 5: outro
tl.from("#o1",{y:30,opacity:0,duration:.5}, 17.1);
tl.to("#o1",{opacity:0,duration:.3}, 18.4);
tl.to("#o2",{opacity:1,duration:.4}, 18.6);
tl.to("#o3",{opacity:1,duration:.4}, 19.0);

window.__timelines = window.__timelines || {};
window.__timelines["root"] = tl;
</script>
</div></body></html>
