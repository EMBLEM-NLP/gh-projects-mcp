name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run contract:check
      - run: npm run contract:write
      - name: Upload generated MCP tool contract
        uses: actions/upload-artifact@v4
        with:
          name: gh-projects-tool-contract
          path: contracts/tools.json
