name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run contract:check
      - name: Bootstrap generated MCP contract snapshot
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if [ ! -f contracts/tools.json ]; then
            npm run contract:write
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/tools.json
            git commit -m "test: snapshot MCP tool contract"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Verify committed MCP tool contract
        run: |
          if [ -f contracts/tools.json ]; then
            npm run contract:verify
          else
            npm run contract:write
            npm run contract:verify
          fi
