name: Bootstrap issue lifecycle
on:
  push:
    branches: [fix/issue-lifecycle-tools]
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: run issue lifecycle bootstrap'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: python scripts/bootstrap_issue_lifecycle.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm run lint
      - run: npm run contract:write
      - run: npm test
      - run: npm run contract:verify
      - run: npm run package:verify
      - name: Commit issue lifecycle implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs lib/github-backend.mjs package.json package-lock.json .claude-plugin/plugin.json .codex-plugin/plugin.json skills/gh-project-manage/SKILL.md .claude/skills/gh-project-manage/SKILL.md README.md contracts/tools.json
          git commit -m "feat: add verified issue lifecycle tools"
          git push origin HEAD:${GITHUB_REF_NAME}
# one-shot bootstrap
