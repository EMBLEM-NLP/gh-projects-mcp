name: Sync 1.5.0 lockfile metadata
on:
  push:
    branches: [feat/field-mutation-modernization]
permissions:
  contents: write
jobs:
  sync:
    if: "github.event.head_commit.message == 'chore: sync 1.5.0 lockfile metadata'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync 1.5.0 lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
