name: Bootstrap workflow auto-add
on:
  push:
    branches: [fix/workflow-autoadd-correctness]
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: run workflow auto-add bootstrap'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: python scripts/bootstrap_workflow_autoadd.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm run lint
      - run: npm run contract:write
      - run: npm test
      - run: npm run contract:verify
      - run: npm run package:verify
      - name: Commit integrated workflow tool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs lib/tools-workflows.mjs package.json package-lock.json .claude-plugin/plugin.json .codex-plugin/plugin.json skills/gh-project-manage/SKILL.md .claude/skills/gh-project-manage/SKILL.md .claude/agents/gh-project-manager.md README.md contracts/tools.json
          git commit -m "feat: add verified workflow auto-add configuration"
          git push origin HEAD:${GITHUB_REF_NAME}
# one-shot bootstrap retry
